<div class="queue-container">
  <!-- Shared Breadcrumb Navigation -->
  <app-breadcrumb
    [items]="breadcrumbItems"
    backUrl="/reader"
    backLabel="Danh sách đề thi"
  >
    <div actions class="header-actions">
      <button 
        type="button" 
        class="btn btn-primary btn-sm"
        [disabled]="mistakes().length === 0"
        (click)="openImportModal()"
      >
        <i class="fas fa-robot"></i> Import AI ({{ pendingCount() > 0 ? pendingCount() + ' câu chờ' : mistakes().length + ' câu' }})
      </button>
    </div>
  </app-breadcrumb>

  <!-- Stats Bar -->
  <div class="stats-row">
    <div class="stat-pill" [class.active]="activeTab() === 'all'" (click)="setTab('all')">
      <span class="stat-num">{{ mistakes().length }}</span>
      <span class="stat-label">Tất cả lỗi</span>
    </div>
    <div class="stat-pill pending" [class.active]="activeTab() === 'pending'" (click)="setTab('pending')">
      <span class="stat-num">{{ pendingCount() }}</span>
      <span class="stat-label">Chờ AI giải thích</span>
    </div>
    <div class="stat-pill explained" [class.active]="activeTab() === 'explained'" (click)="setTab('explained')">
      <span class="stat-num">{{ explainedCount() }}</span>
      <span class="stat-label">Đã có giải thích</span>
    </div>
    <div class="stat-pill resolved" [class.active]="activeTab() === 'resolved'" (click)="setTab('resolved')">
      <span class="stat-num">{{ resolvedCount() }}</span>
      <span class="stat-label">Đã hiểu ✓</span>
    </div>
  </div>

  <!-- Filter & Search Controls -->
  <div class="controls-bar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Tìm theo tên đề thi hoặc số câu..." 
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
      />
    </div>
  </div>

  <!-- Mistakes List -->
  @if (paginatedMistakes().length > 0) {
    <div class="mistakes-list">
      @for (item of paginatedMistakes(); track item.id) {
        <app-mistake-item
          [mistake]="item"
          (saveExplanation)="onSaveExplanation($event)"
          (markResolved)="onMarkResolved($event)"
          (deleteMistake)="onDeleteMistake($event)"
        ></app-mistake-item>
      }
    </div>

    <!-- Paginator Component from @shared/components -->
    <app-paginator
      [totalItems]="filteredMistakes().length"
      [(currentPage)]="currentPage"
      [(pageSize)]="pageSize"
      [pageSizeOptions]="[5, 10, 20, 50]"
    ></app-paginator>
  } @else {
    <!-- Empty state -->
    <app-empty-state
      icon="🎉"
      title="Không có lỗi sai nào"
      description="Bạn chưa có câu hỏi nào trong danh sách này, hoặc đã giải quyết hết các lỗi!"
    ></app-empty-state>
  }
</div>

<!-- AI Review Import Modal (Prompt Generator & JSON Importer) -->
@if (showImportModal()) {
  <app-ai-review-import-modal
    [isOpen]="showImportModal()"
    [testName]="'TOEIC Mistake Queue'"
    [questionsToReview]="questionsNeedingReview()"
    (importData)="handleImportMistakeReviews($event)"
    (close)="closeImportModal()"
  ></app-ai-review-import-modal>
}
