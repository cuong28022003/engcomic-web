<div class="create-test-container">
  <!-- Shared Breadcrumb Navigation -->
  <app-breadcrumb
    [items]="breadcrumbItems"
    backUrl="/reader"
    backLabel="Danh sách đề thi"
  ></app-breadcrumb>

  <!-- Stepper Indicator -->
  <div class="stepper-bar">
    <div class="step-item" [class.active]="currentStep === 1" [class.completed]="currentStep > 1" (click)="currentStep = 1">
      <div class="step-circle">1</div>
      <div class="step-label">Thông tin & Tệp PDF</div>
    </div>
    <div class="step-line" [class.active]="currentStep > 1"></div>
    <div class="step-item" [class.active]="currentStep === 2" [class.completed]="currentStep > 2" (click)="testName ? currentStep = 2 : null">
      <div class="step-circle">2</div>
      <div class="step-label">Hướng dẫn AI Prompt</div>
    </div>
    <div class="step-line" [class.active]="currentStep > 2"></div>
    <div class="step-item" [class.active]="currentStep === 3" (click)="testName ? currentStep = 3 : null">
      <div class="step-circle">3</div>
      <div class="step-label">Nhập JSON Đáp án</div>
    </div>
  </div>

  @if (errorMessage) {
    <div class="error-toast">
      ❌ {{ errorMessage }}
    </div>
  }

  @if (submitting) {
    <div class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Đang tải lên PDF và tạo đề thi... Vui lòng đợi trong giây lát.</div>
    </div>
  }

  <!-- Step 1 -->
  @if (currentStep === 1) {
    <app-pdf-upload-step
      [testName]="testName"
      [pdfUrl]="pdfUrl"
      [selectedFile]="pdfFile"
      [section]="section"
      [audioFile]="audioFile"
      (stepCompleted)="onStep1Completed($event)"
    ></app-pdf-upload-step>
  }

  <!-- Step 2 -->
  @if (currentStep === 2) {
    <app-ai-parse-prompt-step
      [testName]="testName"
      [section]="section"
      (prevStep)="onStep2Back()"
      (nextStep)="onStep2Next()"
    ></app-ai-parse-prompt-step>
  }

  <!-- Step 3 -->
  @if (currentStep === 3) {
    <app-answer-key-import-step
      [section]="section"
      (prevStep)="onStep3Back()"
      (submitTest)="onSubmitTest($event)"
    ></app-answer-key-import-step>
  }
</div>
