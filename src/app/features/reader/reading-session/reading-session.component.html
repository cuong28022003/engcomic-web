<div class="session-wrapper">
  <!-- Top Bar Navigation with Shared Breadcrumb -->
  <app-breadcrumb
    [items]="breadcrumbItems()"
    backUrl="/reader"
    backLabel="Danh sách đề"
  >
    <div actions class="session-header-actions">
      <!-- Mobile view switch tabs -->
      <div class="mobile-tabs">
        <button 
          type="button" 
          class="m-tab-btn" 
          [class.active]="activeMobileTab() === 'pdf'"
          (click)="setMobileTab('pdf')"
        >
          📄 Đề thi PDF
        </button>
        <button 
          type="button" 
          class="m-tab-btn" 
          [class.active]="activeMobileTab() === 'answers'"
          (click)="setMobileTab('answers')"
        >
          📝 Bảng đáp án
        </button>
      </div>

      <div class="topbar-actions-right">
        <button type="button" class="btn btn-secondary btn-sm" (click)="openHistory()">
          <i class="fas fa-history"></i> Lịch sử làm bài
        </button>
        <a routerLink="/reader/mistakes" class="btn btn-secondary btn-sm queue-link-btn">
          🚨 Hàng đợi lỗi
        </a>
      </div>
    </div>
  </app-breadcrumb>

  <!-- Resume Dang Do Attempt Modal -->
  @if (showResumeModal() && activeAttempt()) {
    <app-resume-attempt-modal
      [isOpen]="showResumeModal()"
      [attempt]="activeAttempt()"
      (resume)="onResumeAttempt($event)"
      (abandon)="onAbandonAttempt($event)"
      (dismiss)="onCancelConfig()"
    ></app-resume-attempt-modal>
  }

  <!-- Pre-Test Time Target Config Modal -->
  @if (test() && showConfigModal()) {
    <app-pre-test-config-modal
      [isOpen]="showConfigModal()"
      (startTest)="onStartTest($event)"
      (cancel)="onCancelConfig()"
    ></app-pre-test-config-modal>
  }

  <!-- Attempt History Modal -->
  @if (showHistoryModal()) {
    <app-attempt-history-modal
      [isOpen]="showHistoryModal()"
      [attempts]="historyAttempts()"
      [testTitle]="test()?.testName || ''"
      (close)="closeHistory()"
    ></app-attempt-history-modal>
  }

  <!-- Loading / Submitting / Error states via Shared Components -->
  @if (submitting()) {
    <app-loading [message]="'Đang nộp bài và chấm điểm... Vui lòng đợi trong giây lát!'"></app-loading>
  } @else if (loading()) {
    <app-loading [message]="'Đang tải dữ liệu bài thi...'"></app-loading>
  } @else if (errorMessage()) {
    <app-error-state
      [title]="'Không thể tải bài thi'"
      [message]="errorMessage()"
      (retry)="loadTestDetailAndCheckAttempt()"
    ></app-error-state>
  } @else {
    @if (test(); as t) {
      <!-- Main Split Layout -->
      <main class="session-main">
        <!-- Left Pane: PDF Viewer -->
        <section 
          class="pane-pdf" 
          [class.mobile-hidden]="activeMobileTab() !== 'pdf'"
        >
          <app-pdf-viewer [pdfUrl]="t.pdfUrl"></app-pdf-viewer>
        </section>

        <!-- Right Pane: Answer Sheet -->
        <section 
          class="pane-answers" 
          [class.mobile-hidden]="activeMobileTab() !== 'answers'"
        >
          <app-answer-sheet
            [testId]="t.id"
            [testName]="t.testName"
            [questions]="filteredQuestions()"
            [isSubmitted]="isSubmitted()"
            [gradedResults]="gradedResults()"
            (submitAnswers)="onSubmitAnswers($event)"
          ></app-answer-sheet>
        </section>
      </main>
    }
  }
</div>
