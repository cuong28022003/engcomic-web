@if (isOpen()) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal-card glass-panel" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="header-title-group">
          <i class="fa-solid fa-robot header-icon"></i>
          <h3>Trích Xuất System Prompt Cho AI</h3>
        </div>
        <button class="close-btn" (click)="onClose()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">
        @if ((promptData()?.wordCount || 0) === 0) {
          <div class="all-done-notice">
            <i class="fa-solid fa-circle-check"></i>
            <p>Tất cả từ vựng trong danh sách này đều đã được tạo bài tập từ trước!</p>
          </div>
        } @else {
          <app-ai-import-workspace
            [enableModeSwitch]="false"
            [showStepper]="false"
            currentStep="prompt"
            [promptText]="promptData()?.systemPrompt || ''"
            [metaBadges]="metaBadges()"
            instruction="Sao chép System Prompt dưới đây và dán vào ChatGPT (GPT-4o) hoặc Claude 3.5 Sonnet để AI sinh gói bài tập 4-Level:"
            promptTerminalTitle="Practice Prompt Generator (.json)"
            pasteActionLabel="Đã Copy, Sang Dán JSON Bài Tập"
            (proceedToPaste)="goToImport()"
            (cancel)="onClose()"
          ></app-ai-import-workspace>
        }
      </div>
    </div>
  </div>
}
