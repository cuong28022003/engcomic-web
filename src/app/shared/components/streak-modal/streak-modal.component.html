<app-modal
  [isOpen]="isOpen()"
  title="Chuỗi học"
  size="sm"
  (closed)="onClose()"
>
  <div class="streak-modal-body">
    <div class="streak-hero">
      <div class="flame-wrap" [class.active]="isStudiedToday()">
        <i class="fa-solid fa-fire"></i>
      </div>
      <div class="streak-count">{{ streakCount() }}</div>
      <div class="streak-label">ngày liên tiếp</div>
      <div class="streak-sub" [class.done]="isStudiedToday()">
        @if (isStudiedToday()) {
          <span>Đã học hôm nay!</span>
        } @else {
          <span>Học bài để duy trì chuỗi</span>
        }
      </div>
    </div>

    <div class="week-row">
      @for (d of weekDays(); track d.dayLabel) {
        <div class="week-day" [class.today]="d.isToday" [class.done]="d.isCompleted">
          <span class="day-name">{{ d.dayLabel }}</span>
          <div class="day-dot">
            @if (d.isCompleted) {
              <i class="fa-solid fa-check"></i>
            } @else if (d.isToday) {
              <div class="dot"></div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</app-modal>
