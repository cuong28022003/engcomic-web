<div
  class="rank-avatar-frame-container"
  [ngClass]="[tierClass(), 'size-' + size(), shapeClass()]"
  [class.has-glow]="showGlow()"
>
  <div class="badge-wrapper">
    <!-- Khung tròn ngoài -->
    <div class="outer-frame"></div>

    <!-- Tia lấp lánh -->
    @if (tierIndex() >= 1) {
      <div class="glint" style="top: 5px; right: 18px; animation-delay: 0.2s;"></div>
    }
    @if (tierIndex() >= 2) {
      <div class="glint" style="bottom: 15px; left: 10px; animation-delay: 1.5s;"></div>
    }
    @if (tierIndex() >= 4) {
      <div class="glint" style="top: -5px; left: 20px; animation-delay: 0.3s;"></div>
      <div class="glint" style="top: 40px; right: -5px; animation-delay: 1.3s;"></div>
    }
    @if (tierIndex() === 6) {
      <div class="glint" style="top: -15px; left: 35px; animation-delay: 0.1s; width:16px; height:16px;"></div>
      <div class="glint" style="top: 20px; right: -15px; animation-delay: 0.8s;"></div>
      <div class="glint" style="bottom: -5px; left: -10px; animation-delay: 1.4s;"></div>
      <div class="glint" style="bottom: 20px; right: 10px; animation-delay: 2.0s; width:16px; height:16px;"></div>
    }

    <!-- Hào quang nền -->
    @if (tierIndex() === 2) {
      <div class="aura-glow"></div>
    }
    @if (tierIndex() === 3) {
      <div class="pulse-core"></div>
    }
    @if (tierIndex() === 4) {
      <div class="prism-glow"></div>
      <div class="star-frame"></div>
    }
    @if (tierIndex() === 5) {
      <div class="magic-ring"></div>
    }
    @if (tierIndex() === 6) {
      <div class="halo-ring"></div>
      <div class="runic-array"></div>
      <div class="solar-flare"></div>
    }

    <!-- Khiên Lục Giác: Chứa Avatar hoặc Badge Image -->
    <div class="badge-shield">
      <div class="shield-pattern"></div>
      <div class="shield-inner-border"></div>

      @if (displayAvatarUrl()) {
        <img
          [src]="displayAvatarUrl()"
          alt="User Avatar"
          class="avatar-hexagon-img"
          loading="lazy"
        />
      } @else {
        <img
          [src]="displayBadgeImgUrl()"
          alt="Rank Badge"
          class="badge-hexagon-img"
          (error)="onBadgeImgError($event)"
          loading="lazy"
        />
      }


    </div>

    <!-- Hiệu ứng xòe theo bậc rank đã bị loại bỏ -->
  </div>
</div>
