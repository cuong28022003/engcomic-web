<div
  class="word-mini-chip"
  [class.chip-collected]="isPending"
  [class.chip-saved]="isSaved"
  [title]="chipTitle"
>
  <!-- Text từ (chỉ hiện nếu có word) -->
  @if (word()) {
    <span class="chip-word" (click)="playAudio($event)">{{ word() }}</span>
  }

  <!-- Badge loại từ (chỉ hiện nếu có pos VÀ posLabel có giá trị) -->
  @if (pos() && posLabel) {
    <span class="chip-pos" [ngClass]="posClass">{{ posLabel }}</span>
  }

  <!-- Nút loa (chỉ hiện nếu showAudio = true VÀ có word) -->
  @if (showAudio() && word()) {
    <button
      type="button"
      class="chip-btn btn-audio"
      (click)="playAudio($event)"
      title="Nghe phát âm (US)"
      [attr.aria-label]="'Phát âm ' + word()"
    >
      <i class="fa-solid fa-volume-high"></i>
    </button>
  }

  <!-- Nút + collector (chỉ hiện nếu showCollect = true VÀ có word) -->
  @if (showCollect() && word()) {
    <button
      type="button"
      class="chip-btn btn-collect"
      [class.collected]="isSaved"
      [disabled]="isSaved || isAdding()"
      (click)="addToCollector($event)"
      [title]="collectTooltip"
      [attr.aria-label]="collectAria"
    >
      @if (isAdding()) {
        <i class="fa-solid fa-spinner fa-spin"></i>
      } @else if (isSaved) {
        <i class="fa-solid fa-check"></i>
      } @else {
        <i class="fa-solid fa-plus"></i>
      }
    </button>
  }
</div>
