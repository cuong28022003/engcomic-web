<div class="form-input-group" [class.has-error]="errorMessage()">
  @if (label()) {
    <label class="form-label">
      {{ label() }}
      @if (required()) {
        <span class="required-star">*</span>
      }
    </label>
  }
  
  <div class="input-container" [class.is-textarea]="type() === 'textarea'">
    @if (icon() && type() !== 'textarea') {
      <i [class]="icon()" class="input-icon"></i>
    }
    
    @if (type() === 'textarea') {
      <textarea
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [rows]="rows()"
        [value]="value()"
        (input)="onInputChange($event)"
        class="form-control textarea-control"
      ></textarea>
    } @else {
      <input
        [type]="currentType()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [value]="value()"
        (input)="onInputChange($event)"
        class="form-control"
      />
    }

    @if (type() === 'password') {
      <button type="button" class="password-toggle-btn" (click)="togglePassword()">
        <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
      </button>
    }
  </div>

  @if (helperText() && !errorMessage()) {
    <span class="helper-text">{{ helperText() }}</span>
  }

  @if (errorMessage()) {
    <div class="error-feedback">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ errorMessage() }}</span>
    </div>
  }
</div>
